spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:auth-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
naver:
  api:
    client-id: test
    client-secret: test
