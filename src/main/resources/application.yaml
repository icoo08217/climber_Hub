spring:
  config:
    import: optional:classpath:application-secret.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
#    show-sql: true
    properties:
      hibernate:
#        format_sql: true
#        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: info

server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  media:
    cloudinary:
      enabled: false
